name: Build Oficina IA

# Daily: if Munder Difflin published new code, rebuild with our changes on top.
# Also rebuilds whenever this repo changes, or by hand (Actions → Run workflow).
on:
  schedule:
    - cron: "23 10 * * *"   # every day ~6:23 AM Miami
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["custom/**", ".github/workflows/**"]

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

env:
  UPSTREAM: HarnessMD/munder-difflin

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.up.outputs.build }}
      sha: ${{ steps.up.outputs.sha }}
    steps:
      - id: up
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(git ls-remote "https://github.com/$UPSTREAM.git" HEAD | cut -f1)
          LAST=$(gh release view --repo "$GITHUB_REPOSITORY" --json body -q .body 2>/dev/null | grep -o 'upstream: [0-9a-f]*' | cut -d' ' -f2 || true)
          echo "upstream=$SHA last-built=$LAST event=${{ github.event_name }}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$SHA" != "$LAST" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Nothing new upstream - skipping build."
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Our customizations
        uses: actions/checkout@v4
        with:
          path: oia

      - name: Munder Difflin source (MIT)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ needs.check.outputs.sha }}
          path: app

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies (builds native modules for Electron)
        working-directory: app
        run: npm ci --no-audit --no-fund

      - name: Apply Oficina IA changes
        working-directory: app
        shell: bash
        env:
          OIA_REPO: ${{ github.repository }}
          OIA_RUN: ${{ github.run_number }}
        run: node ../oia/custom/apply.cjs

      - name: Build app
        working-directory: app
        run: npm run build

      - name: Package Windows installer
        working-directory: app
        run: npx electron-builder --win nsis --x64 --config oficina-builder.yml --publish never

      - name: Publish release
        working-directory: app
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(node -p "require('./package.json').version")
          UPV=$(git show HEAD:package.json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).version))")
          ls dist
          gh release create "v$VER" --repo "$GITHUB_REPOSITORY" \
            --title "Oficina IA $VER" \
            --notes "Based on Munder Difflin $UPV. upstream: ${{ needs.check.outputs.sha }}" \
            dist/*.exe dist/*.exe.blockmap dist/latest.yml
